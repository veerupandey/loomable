name: CI

on:
  push:
    branches: [main, "cursor/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,toolkits]"
      - name: Unit tests
        run: python -m pytest tests/unit -q --tb=short
      - name: Property tests
        run: python -m pytest tests/properties -q --tb=short
      - name: Toolkit tests
        run: python -m pytest tests/toolkits -q --tb=short
      - name: Integration (non-live)
        run: >
          python -m pytest tests/integration -q --tb=short
          --ignore=tests/integration/test_postgres_live.py
          --ignore=tests/integration/test_memory_parity_live.py

  live-optional:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,toolkits,postgres]"
      - name: Live Gemini deep gate
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        env:
          DEEP_AGENT_LIVE: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: python examples/deep_agent/05_live_gemini_gate.py
      - name: Live Postgres
        if: ${{ secrets.POSTGRES_URL != '' }}
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: python -m pytest tests/integration/test_postgres_live.py -q --tb=short
