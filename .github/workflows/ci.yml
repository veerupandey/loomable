name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,toolkits]"
      - name: Unit tests
        run: python -m pytest tests/unit -q --tb=short
      - name: Property tests
        run: python -m pytest tests/properties -q --tb=short
      - name: Toolkit tests
        run: python -m pytest tests/toolkits -q --tb=short
      - name: Integration (non-live)
        run: |
          python -m pytest tests/integration -q --tb=short \
            --ignore=tests/integration/test_postgres_live.py \
            --ignore=tests/integration/test_memory_parity_live.py

  live-optional:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DEEP_AGENT_LIVE: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,toolkits,postgres]"
      - name: Live Gemini deep gate
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "GEMINI_API_KEY not set; skipping live Gemini gate"
            exit 0
          fi
          python examples/deep_agent/live_gate.py
      - name: Live Postgres
        run: |
          if [ -z "${POSTGRES_URL}" ]; then
            echo "POSTGRES_URL not set; skipping live Postgres tests"
            exit 0
          fi
          python -m pytest tests/integration/test_postgres_live.py -q --tb=short
