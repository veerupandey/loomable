services:
  postgres:
    image: postgres:16-alpine
    container_name: loomable-pg
    environment:
      POSTGRES_USER: loomable
      POSTGRES_PASSWORD: loomable
      POSTGRES_DB: loomable
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomable -d loomable"]
      interval: 2s
      timeout: 5s
      retries: 20
