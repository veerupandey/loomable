[project]
name = "loomable"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.7",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.161.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
