[project]
name = "loomable"
version = "0.2.0b0"
description = "Lightweight Python framework for agents, specialist teams, and workflows — Agent, Team, Workflow, Case, AG-UI SSE"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Rakesh Pandey", email = "rakeshpandey820@gmail.com" },
]
keywords = ["ai", "agents", "llm", "workflow", "ag-ui", "sse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/veerupandey/loomable"
Repository = "https://github.com/veerupandey/loomable"
Issues = "https://github.com/veerupandey/loomable/issues"
Documentation = "https://github.com/veerupandey/loomable/blob/main/docs/API.md"

[project.optional-dependencies]
serve = ["fastapi>=0.140.7", "uvicorn>=0.51.0"]
mcp = ["mcp>=1.0.0"]
examples = ["python-dotenv>=1.2.2"]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.35.0",
    "fastapi>=0.140.7",
    "uvicorn>=0.51.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.2.2",
]
pdf = ["pypdf"]
ppt = ["python-pptx"]
url = ["httpx", "beautifulsoup4"]
web = ["ddgs"]
postgres = ["asyncpg>=0.29.0"]
bedrock = ["boto3>=1.34.0"]
zvec = ["zvec>=0.5.0"]
faiss = ["faiss-cpu>=1.8.0"]
chroma = ["chromadb>=0.5.0"]
milvus = ["pymilvus[milvus_lite]>=2.4.0"]
huggingface = ["sentence-transformers>=2.2.0"]
embeddings = ["sentence-transformers>=2.2.0"]
toolkits = ["pypdf", "python-pptx", "httpx", "beautifulsoup4", "ddgs"]
retrieval = [
    "zvec>=0.5.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=2.2.0",
    "pypdf",
    "beautifulsoup4",
    "chromadb>=0.5.0",
    "pymilvus[milvus_lite]>=2.4.0",
]


[dependency-groups]
dev = [
    "hypothesis>=6.161.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.35.0",
    "fastapi>=0.140.7",
    "uvicorn>=0.51.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["loomable"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast isolated unit tests",
    "integration: slower integration tests",
    "live: explicitly opted-in external provider tests",
]
