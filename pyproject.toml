[project]
name = "loomable"
version = "0.1.0"
description = "Enterprise AI agent framework — Agent, Team, Workflow, Case, AG-UI SSE"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Rakesh Pandey", email = "rakeshpandey820@gmail.com" },
]
keywords = ["ai", "agents", "llm", "workflow", "ag-ui", "sse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.140.7",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/veerupandey/loomable"
Repository = "https://github.com/veerupandey/loomable"
Issues = "https://github.com/veerupandey/loomable/issues"
Documentation = "https://github.com/veerupandey/loomable/blob/main/docs/API.md"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.35.0",
]
pdf = ["pypdf"]
ppt = ["python-pptx"]
url = ["httpx", "beautifulsoup4"]
web = ["ddgs"]
postgres = ["asyncpg>=0.29.0"]
toolkits = ["pypdf", "python-pptx", "httpx", "beautifulsoup4", "ddgs"]

[dependency-groups]
dev = [
    "hypothesis>=6.161.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["loomable"]

[tool.hatch.build.targets.wheel.force-include]
"loomable/skills" = "loomable/skills"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: slower integration tests",
]
